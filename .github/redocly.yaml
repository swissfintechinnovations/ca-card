plugins:
  - ../github/.github/redocly/redocly_sfti_rules.js

apis:
  level1:
    root: ../src/cardInfoAPI.yaml
    output: ../cardInfoAPI-level1.yaml
    decorators:
      filter-out:
        property: x-api-level
        value: 
          - 2
      sfti/schema-required:
        level: 1
        stripMarker: true
      
  level2:
    root: ../src/cardInfoAPI.yaml
    output: ../cardInfoAPI-level2.yaml
    decorators:
      sfti/schema-required:
        level: 2
        stripMarker: true
      sfti/strip-x-api-level: on

  event-notification-OAS3.1:
    root: ../src/cardAPI-eventNotificationWebhook.yaml
    output: ../cardAPI-eventNotificationWebhook.yaml
