openapi: 3.1.0
info:
  version: 1.0.0
  title: event-notification plugin
  description: |
    This OAS 3.1 specification defines the SFTI Event Notification API standard for secure, and standardized event-based communication
    between financial ecosystem participants. As a cross-stream specification, it provides a generic event notification
    framework used across multiple SFTI repositories, while the stream-specific event types and payload definitions are defined
    and maintained within the respective stream repositories.

    This specification is semantically equivalent to the SPI specifications defined in eventNotificationAPI.yaml and
    eventNotificationWebhookAPI.yaml, but consolidated into a single file to leverage the enhanced capabilities of the OpenAPI 3.1 standard.
  contact:
    email: info@common-api.ch
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://webhook-notification.common-api.ch
externalDocs:
  description: Find out more about SFTI API specifications.
  url: https://www.common-api.ch
tags:
  - name: event subscriptions
    description: |
      Event subscription operations in the context of OAuth2 consent authentication. One subscription is bound to exactly
      one consent and supports create, retrieve, update and delete operations. Multiple event types are managed within the single
      subscription resource.
  - name: event notifications aggregated polling
    description: |
      Aggregated polling operations in the context of Service User authentication, used for catch-up retrieval of event notifications.
security: []
paths:
  /event-subscriptions:
    get:
      tags:
        - event subscriptions
      summary: Get event subscriptions
      description: Get list of event subscriptions.
      operationId: listEventSubscriptions
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/correlation'
      responses:
        '200':
          description: List of event subscriptions.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/X-Correlation-ID'
            Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSubscription'
        '400':
          $ref: '#/components/responses/standard400'
        '401':
          $ref: '#/components/responses/standard401'
        '403':
          $ref: '#/components/responses/standard403'
        '404':
          $ref: '#/components/responses/standard404'
        '405':
          $ref: '#/components/responses/standard405'
        '500':
          $ref: '#/components/responses/standard500'
        '501':
          $ref: '#/components/responses/standard501'
        '503':
          $ref: '#/components/responses/standard503'
        '504':
          $ref: '#/components/responses/standard504'
    post:
      tags:
        - event subscriptions
      summary: Create event subscription
      description: Create event subscription.
      operationId: createEventSubscription
      parameters:
        - $ref: '#/components/parameters/correlation'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubscription'
      responses:
        '201':
          description: Event subscription created.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
        '400':
          $ref: '#/components/responses/standard400'
        '401':
          $ref: '#/components/responses/standard401'
        '403':
          $ref: '#/components/responses/standard403'
        '404':
          $ref: '#/components/responses/standard404'
        '405':
          $ref: '#/components/responses/standard405'
        '409':
          $ref: '#/components/responses/standard409'
        '500':
          $ref: '#/components/responses/standard500'
        '501':
          $ref: '#/components/responses/standard501'
        '503':
          $ref: '#/components/responses/standard503'
        '504':
          $ref: '#/components/responses/standard504'
  /event-subscriptions/{eventSubscriptionId}:
    get:
      tags:
        - event subscriptions
      summary: Get event subscription
      description: Get event subscription by id.
      operationId: getEventSubscription
      parameters:
        - $ref: '#/components/parameters/event_subscription_id'
        - $ref: '#/components/parameters/correlation'
      responses:
        '200':
          description: Get event subscriptions.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
        '400':
          $ref: '#/components/responses/standard400'
        '401':
          $ref: '#/components/responses/standard401'
        '403':
          $ref: '#/components/responses/standard403'
        '404':
          $ref: '#/components/responses/standard404'
        '405':
          $ref: '#/components/responses/standard405'
        '500':
          $ref: '#/components/responses/standard500'
        '501':
          $ref: '#/components/responses/standard501'
        '503':
          $ref: '#/components/responses/standard503'
        '504':
          $ref: '#/components/responses/standard504'
    put:
      tags:
        - event subscriptions
      summary: Update event subscription
      description: Update event subscription.
      operationId: updateEventSubscription
      parameters:
        - $ref: '#/components/parameters/event_subscription_id'
        - $ref: '#/components/parameters/correlation'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubscription'
            example:
              eventTypes:
                - card-transaction:authorized
                - card-transaction:authorizationUpdated
              callbackUrl: /ttpAPI/notifications/card-transactions/
      responses:
        '204':
          description: Successfully updated (empty response).
          headers:
            Correlation-Id:
              $ref: '#/components/headers/X-Correlation-ID'
        '400':
          $ref: '#/components/responses/standard400'
        '401':
          $ref: '#/components/responses/standard401'
        '403':
          $ref: '#/components/responses/standard403'
        '404':
          $ref: '#/components/responses/standard404'
        '405':
          $ref: '#/components/responses/standard405'
        '500':
          $ref: '#/components/responses/standard500'
        '501':
          $ref: '#/components/responses/standard501'
        '503':
          $ref: '#/components/responses/standard503'
        '504':
          $ref: '#/components/responses/standard504'
    delete:
      tags:
        - event subscriptions
      summary: Delete event subscription
      description: Delete event subscription by id.
      operationId: deleteEventSubscription
      parameters:
        - $ref: '#/components/parameters/event_subscription_id'
        - $ref: '#/components/parameters/correlation'
      responses:
        '204':
          description: Successfully deleted.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/X-Correlation-ID'
        '400':
          $ref: '#/components/responses/standard400'
        '401':
          $ref: '#/components/responses/standard401'
        '403':
          $ref: '#/components/responses/standard403'
        '404':
          $ref: '#/components/responses/standard404'
        '500':
          $ref: '#/components/responses/standard500'
        '501':
          $ref: '#/components/responses/standard501'
        '503':
          $ref: '#/components/responses/standard503'
        '504':
          $ref: '#/components/responses/standard504'
  /event-subscriptions/{eventSubscriptionId}/event-notifications:
    get:
      tags:
        - event notifications aggregated polling
      summary: Get event notifications list
      description: Get aggregated event notification list.
      operationId: listEventSubscriptionEventNotifications
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/correlation'
        - $ref: '#/components/parameters/event_subscription_id'
        - $ref: '#/components/parameters/from_event_date_time'
      responses:
        '200':
          description: List of event notifications.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/X-Correlation-ID'
            Next-Cursor:
              $ref: '#/components/headers/X-Next-Cursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventNotification'
        '400':
          $ref: '#/components/responses/standard400'
        '401':
          $ref: '#/components/responses/standard401'
        '403':
          $ref: '#/components/responses/standard403'
        '404':
          $ref: '#/components/responses/standard404'
        '405':
          $ref: '#/components/responses/standard405'
        '429':
          $ref: '#/components/responses/standard429'
        '500':
          $ref: '#/components/responses/standard500'
        '501':
          $ref: '#/components/responses/standard501'
        '503':
          $ref: '#/components/responses/standard503'
        '504':
          $ref: '#/components/responses/standard504'
webhooks:
  event-notification:
    post:
      tags:
        - event notifications aggregated polling
      summary: Send notification
      description: Send notification to consumer.
      operationId: sendEventNotification
      parameters:
        - $ref: '#/components/parameters/correlation'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventNotification'
      responses:
        '202':
          description: Event notification accepted.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/X-Correlation-ID'
        '400':
          $ref: '#/components/responses/standard400'
        '404':
          $ref: '#/components/responses/standard404'
        '405':
          $ref: '#/components/responses/standard405'
        '429':
          $ref: '#/components/responses/standard429'
        '500':
          $ref: '#/components/responses/standard500'
        '501':
          $ref: '#/components/responses/standard501'
        '503':
          $ref: '#/components/responses/standard503'
        '504':
          $ref: '#/components/responses/standard504'
components:
  schemas:
    CommonErrorResponse:
      title: Common Error Response
      description: General error response structure used in different response codes.
      type: object
      properties:
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Detailed problem description with respect to the current request
        instance:
          type: string
          description: A (relative) URI reference that identifies the specific occurrence of the problem.
          examples:
            - path/to/corresponding/resource
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          examples:
            - This is the general problem description
        type:
          type: string
          description: |
            A URI reference that identifies the problem type. When "about:blank" is used, the title SHOULD be the same as the recommended HTTP
            status phrase for that code (e.g., "Not Found" for 404, and so on).
          examples:
            - about:blank
    Correlation:
      title: Shared correlation
      description: |
        Schema for X-Correlation-ID header. The correlation value is a unique value to trace API calls across multiple systems, and used e.g. for
        debugging.
      type: string
      examples:
        - f058ebd6-02f7-4d3f-942e-904344e8cde5
    EventNotification:
      description: Schema of an event notification entity.
      type: object
      required:
        - eventSubscriptionId
        - eventType
        - id
        - resourceLink
      properties:
        eventSubscriptionId:
          type: string
          description: Id of the subscription that caused the event to be triggered.
          readOnly: true
          maxLength: 36
          example: 7c5f40fc-1b29-4263-a2dd-e127a22a947f
        eventType:
          $ref: '#/components/schemas/EventType'
        id:
          type: string
          description: Unique and unambiguous identification (i.e. UUID) of the event subscription.
          example: 120066c9-58a1-432b-aa60-712fae7f143e
        resourceLink:
          type: string
          description: |
            The resourceLink is an absolute or relative URL reference to the specific resource or object that triggered the webhook event.
            This link provides immediate access to the full details of the affected item in the source system.
          example: /card-transactions/e6751a48-0819-4482-98a4-760453ba770d
        creationDateTime:
          type: string
          format: date-time
          description: Timestamp of the creation of the event notification.
          example: 2022-10-26T07:58:30.996+0100
        version:
          type: string
          description: Version of the notification schema.
          example: '1.0'
    EventSubscription:
      description: Schema of an event subscription entity.
      type: object
      required:
        - eventTypes
      properties:
        eventTypes:
          type: array
          description: List of event types subject to subscription.
          items:
            - $ref: ./EventType.yaml
        callbackUrl:
          type: string
          description: |
            Endpoint provided by the client (subscriber) where the server (publisher)
            can send asynchronous event notifications.
          example: https://ttp.com/API/notifications/
        id:
          type: string
          description: Unique and unambiguous identification (i.e. UUID) of the event subscription.
          readOnly: true
          maxLength: 36
          example: 7c5f40fc-1b29-4263-a2dd-e127a22a947f
    EventType:
      description: Event type the subscription should apply to AND reason why a notification is sent.
      type: string
      enum:
        - card-transaction:authorized
        - card-transaction:authorizationUpdated
      example: card-transaction:authorized
  responses:
    standard400:
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Client Error - The request could not be processed due to a problem in the data provided. This could be for any of the reasons of the HTML
        standard that would result in a 4xx code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard401:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Unauthorized - Either no token or an invalid (e.g., token expired) token
        was received.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/INVALID_TOKEN
            title: the token was invalid
            detail: ..
            instance: path/to/corresponding/resource
    standard403:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Forbidden - A valid OAuth Token was received, but access was denied.
        (Depending on the security requirements, providers can return 404 instead).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/INSUFFICIENT_PRIVILEGES
            title: current user has insufficient privileges
            detail: ..
            instance: path/to/corresponding/resource
    standard404:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Not Found - Either the endpoint does not exist or a requested resource is not available.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/SUBSCRIPTION_NOT_FOUND
            title: resource not found
            detail: ..
            instance: path/to/corresponding/resource
    standard405:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Method Not Allowed - The request method is known by the server but is
        not supported by the target resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/METHOD_NOT_ALLOWED
            title: method not allowed
            detail: ..
            instance: path/to/corresponding/resource
    standard409:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        there was a conflict when creating the subscription. e.g., it already
        exists for the same api and version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/SUBSCRIPTION_ALREADY_EXISTS
            title: resource not found
            detail: ..
            instance: path/to/corresponding/resource
    standard429:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        When an SU sends too many lookup or polling requests in a given amount
        of time the SP shall respond with HTTP 429 (Too many requests).
        This response may contain a Retry-After header indicating how long the SU
        must wait before making a new request.
        (see https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/429).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/TOO_MANY_REQUESTS
            title: resource not found
            detail: ..
            instance: path/to/corresponding/resource
    standard500:
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Internal Server Error - The request could not be processed due to a problem at the data provider. This could be for any of the reasons of
        the HTML standard that would result in a 5xx code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    standard501:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: |
        Not Implemented - The request method is not supported by the server and
        cannot be handled.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/TECHNICAL_ERROR
            title: unexpected error occurred
            detail: ..
            instance: path/to/corresponding/resource
    standard503:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: Service Unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/TECHNICAL_ERROR
            title: server unavailable
            detail: ..
            instance: path/to/corresponding/resource
    standard504:
      headers:
        Correlation-Id:
          $ref: '#/components/headers/X-Correlation-ID'
      description: Gateway Timeout.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
          example:
            type: /problems/TECHNICAL_ERROR
            title: server unavailable
            detail: ..
            instance: path/to/corresponding/resource
  parameters:
    correlation:
      in: header
      name: X-Correlation-ID
      description: Unique ID (defined by the caller) which will be reflected back in the response.
      required: false
      schema:
        $ref: '#/components/schemas/Correlation'
    cursor:
      in: query
      name: cursor
      description: Optional parameter for pagination. An opaque string value used for pagination.
      required: false
      schema:
        type: string
        examples:
          - cursorIDxyz
    event_subscription_id:
      in: path
      name: eventSubscriptionId
      description: Event subscription id parameter.
      required: true
      schema:
        type: string
      example: 7c5f40fc-1b29-4263-a2dd-e127a22a947
    from_event_date_time:
      in: query
      name: from_event_date_time
      description: Select all events from this notification date-time or later.
      schema:
        type: string
        format: date-time
        example: 2022-10-26T07:58:30.996+0100
    limit:
      in: query
      name: limit
      description: Optional parameter for pagination. Maximum number of entries to be returned.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        examples:
          - 25
  headers:
    X-Correlation-ID:
      schema:
        $ref: '#/components/schemas/Correlation'
      description: Client defined ID from request to correlates HTTP requests between a client and server.
    X-Next-Cursor:
      description: An opaque string value, or an empty string if there are no more results.
      schema:
        type: string
        examples:
          - cursorIDxyz
  securitySchemes: {}
