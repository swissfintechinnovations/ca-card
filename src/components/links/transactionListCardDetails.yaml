operationId: getCard
description: |
  Details of the payment card which was used for the selected transaction.
  The `card_id` of any entry in the `card-transactions` array can be used as the `cardId` path parameter.
  The expression below addresses the first entry; it applies to every entry alike.

  Example: `GET /cards/eb404f8d-656b-4e51-8872-88c42fa55536`
parameters:
  cardId: $response.body#/card-transactions/0/card_id
