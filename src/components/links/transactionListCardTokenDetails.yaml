operationId: getCardToken
description: |
  Details of the card token which was used for the selected transaction. Only applicable if the entry contains a `token_id`.
  The `token_id` of any entry in the `card-transactions` array can be used as the `tokenId` path parameter.
  The expression below addresses the first entry; it applies to every entry alike.

  Example: `GET /card-tokens/eb404f8d-656b-4e51-8872-88c42fa55536`
parameters:
  tokenId: $response.body#/card-transactions/0/token_id
