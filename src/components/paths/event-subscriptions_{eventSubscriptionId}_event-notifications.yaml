get:
  tags:
    - event notifications aggregated polling
  summary: Get event notifications list
  description: Get aggregated event notification list.
  operationId: listEventSubscriptionEventNotifications
  parameters:
    - $ref: ../parameters/query/cursor.yaml
    - $ref: ../parameters/query/limit.yaml
    - $ref: ../parameters/header/correlation.yaml
    - $ref: ../parameters/query/event_subscription_id.yaml
    - $ref: ../parameters/query/from_event_date_time.yaml
  responses:
    '200':
      description: List of event notifications.
      headers:
        Correlation-Id:
          $ref: ../headers/X-Correlation-ID.yaml
        Next-Cursor:
          $ref: ../headers/X-Next-Cursor.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/EventNotification.yaml
    '400':
      $ref: ../responses/standard400.yaml
    '401':
      $ref: ../responses/standard401.yaml
    '403':
      $ref: ../responses/standard403.yaml
    '404':
      $ref: ../responses/standard404.yaml
    '405':
      $ref: ../responses/standard405.yaml
    '429':
      $ref: ../responses/standard429.yaml
    '500':
      $ref: ../responses/standard500.yaml
    '501':
      $ref: ../responses/standard501.yaml
    '503':
      $ref: ../responses/standard503.yaml
    '504':
      $ref: ../responses/standard504.yaml
